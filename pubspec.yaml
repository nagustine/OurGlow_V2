name: our_glow
description: OurGlow — Skincare Checker.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/banner.png
    - assets/images/diary.png
    - assets/images/girl_scan.png
    - assets/images/kamera_scan.png
    - assets/images/love_emoji.png
    - assets/images/our_glow.png
    - assets/images/pattern_sparkle.png
    - assets/images/routine.png
    - assets/images/scan_emoji.png
    - assets/images/warning_emoji.png
    - assets/images/produk_cleanser.png
    - assets/images/produk_moisturizer.png
    - assets/images/produk_retinol.png
    - assets/images/produk_serum_vitc.png
    - assets/images/produk_sunscreen.png
    - assets/images/produk_toner_bha.png
    - lib/data/ingredients.json 